services:

  postgres:
    image: postgis/postgis:15-3.3
    container_name: wildlife_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: wildlife_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d wildlife_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  mongodb:
    image: mongo:latest
    container_name: wildlife_mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: supersecretpassword

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: wildlife_backend

    environment:
      POSTGRES_DSN: postgresql://admin:supersecretpassword@postgres:5432/wildlife_db

      MONGO_URI: mongodb://admin:supersecretpassword@mongodb:27017/?authSource=admin

      MONGO_DB_NAME: wildlife_monitoring

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

    ports:
      - "8000:8000"

    depends_on:

      postgres:
        condition: service_healthy

      mongodb:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  mongo_data:
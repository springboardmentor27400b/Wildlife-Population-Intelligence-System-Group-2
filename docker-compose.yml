version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpis_backend_prod
    ports:
      - "8000:8000"
    environment:
      # Use an external MongoDB Atlas URL or similar for production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:80}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time variables for Vite
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: wpis_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Note: MongoDB is omitted from this production compose file
  # as it is recommended to use a managed database service (e.g. MongoDB Atlas)
  # for production workloads. If local DB is required, uncomment below:
  #
  # mongodb:
  #   image: mongo:latest
  #   container_name: wpis_mongodb_prod
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data_prod:/data/db
  #   restart: unless-stopped

# volumes:
#   mongodb_data_prod:

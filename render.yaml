services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: wildlife-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://wildlife-frontend.onrender.com,http://localhost:5173

  # 2. React Vite Frontend Static Site
  - type: web
    name: wildlife-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://wildlife-backend.onrender.com

databases:
  # 3. PostgreSQL Database Service
  - name: wildlife-db
    databaseName: wildlife_prod
    user: wildlife_admin
    plan: starter
